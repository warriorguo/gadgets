<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>代码片段 · Gadgets</title>
  <link rel="stylesheet" href="../assets/common.css" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/tokyo-night-dark.min.css"
  />
  <style>
    /* ----- editor shell ----- */
    .editor-wrap {
      flex: 1;
      position: relative;
      overflow: auto;
      background: var(--bg);
    }

    /* Shared typography between the highlight layer and the input layer.
       These must match EXACTLY or the caret will drift away from the
       characters it is supposedly between. */
    .hl-layer,
    .input-layer {
      margin: 0;
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      tab-size: 4;
      letter-spacing: 0;
      white-space: pre;
      word-spacing: 0;
      padding: 16px 16px 16px 5em;   /* 5em left makes room for the line-no gutter */
      border: 0;
    }

    .hl-layer {
      position: relative;
      min-height: 100%;
      pointer-events: none;          /* clicks fall through to the textarea */
      counter-reset: linecount;
      background: transparent;
    }
    .hl-layer code.hljs {
      display: block;
      background: transparent;
      padding: 0;
    }
    .hl-layer .ln {
      counter-increment: linecount;
      display: block;
      min-height: 1.6em;             /* keep empty lines tall enough to land on */
      position: relative;
    }
    .hl-layer .ln::before {
      content: counter(linecount);
      position: absolute;
      left: -4em;
      width: 3em;
      text-align: right;
      color: var(--text-dim);
      opacity: 0.5;
      user-select: none;
      pointer-events: none;
    }

    .input-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: transparent;
      caret-color: var(--text);
      resize: none;
      outline: none;
      overflow: hidden;              /* parent .editor-wrap handles scroll */
      -webkit-text-fill-color: transparent;
    }
    .input-layer::selection {
      background: rgba(122, 162, 247, 0.35);
    }

    /* ----- status bar (replaces the old per-pane meta) ----- */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
    }
    .status-bar .lang-name {
      color: var(--accent);
      font-weight: 600;
    }
    .status-bar .lang-source { opacity: 0.7; margin-left: 4px; }
    .status-bar .right { font-variant-numeric: tabular-nums; }

    select.lang-select {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 10px;
      font-size: 13px;
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
    }
    select.lang-select:hover { border-color: var(--accent); }

    /* ----- outline sidebar ----- */
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .outline {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow: hidden;
      transition: width 0.18s ease;
    }
    .outline.collapsed { width: 30px; }
    .outline.collapsed .outline-body,
    .outline.collapsed .outline-header .title { display: none; }
    .outline.collapsed .outline-header {
      justify-content: center;
      padding: 6px 0;
    }
    .outline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .outline-header .toggle {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      line-height: 1;
    }
    .outline-header .toggle:hover { color: var(--accent); }
    .outline-body {
      flex: 1;
      overflow: auto;
    }
    .outline-list {
      list-style: none;
      margin: 0;
      padding: 4px 0;
    }
    .outline-list li {
      padding: 3px 12px;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      line-height: 1.5;
    }
    .outline-list li.kind-class,
    .outline-list li.kind-impl {
      color: var(--accent-2);
    }
    .outline-list li.kind-method { padding-left: 28px; }
    .outline-list li:hover { background: rgba(122, 162, 247, 0.1); }
    .outline-list li.active { background: rgba(122, 162, 247, 0.18); }
    .outline-list li .name {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 12.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }
    .outline-list li .line-no {
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      opacity: 0.6;
      flex-shrink: 0;
    }
    .outline-empty {
      color: var(--text-dim);
      font-size: 12px;
      padding: 14px 12px;
      text-align: center;
      opacity: 0.7;
    }

    /* Flash highlight for the target line after a jump. */
    .hl-layer .ln.target-flash {
      animation: target-flash 1.6s ease-out;
    }
    @keyframes target-flash {
      0%   { background: rgba(187, 154, 247, 0.35); }
      40%  { background: rgba(187, 154, 247, 0.20); }
      100% { background: transparent; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>代码片段</h1>
      <div class="actions">
        <select id="lang-select" class="lang-select" title="语言（auto = 自动识别）">
          <option value="auto">语言: 自动识别</option>
          <option value="csharp">C#</option>
          <option value="go">Go</option>
          <option value="python3">Python 3</option>
          <option value="python2">Python 2</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="java">Java</option>
          <option value="kotlin">Kotlin</option>
          <option value="swift">Swift</option>
          <option value="rust">Rust</option>
          <option value="cpp">C++</option>
          <option value="c">C</option>
          <option value="ruby">Ruby</option>
          <option value="php">PHP</option>
          <option value="bash">Bash</option>
          <option value="sql">SQL</option>
          <option value="json">JSON</option>
          <option value="yaml">YAML</option>
          <option value="xml">HTML / XML</option>
          <option value="css">CSS</option>
          <option value="markdown">Markdown</option>
          <option value="plaintext">Plain Text</option>
        </select>
        <input type="file" id="file-input" hidden />
        <button id="open-btn">打开文件</button>
        <button id="clear-btn">清空</button>
        <a class="home-link" href="../">← Gadgets</a>
      </div>
    </header>

    <div class="main">
      <aside class="outline" id="outline">
        <div class="outline-header">
          <span class="title">函数 / 类</span>
          <button class="toggle" id="outline-toggle" title="折叠/展开">«</button>
        </div>
        <div class="outline-body">
          <ul class="outline-list" id="outline-list"></ul>
        </div>
      </aside>

      <div class="editor-wrap" id="editor-wrap">
        <pre class="hl-layer" aria-hidden="true"><code id="output" class="hljs"></code></pre>
        <textarea id="input" class="input-layer" spellcheck="false"
          placeholder="在此粘贴代码，或将文件拖入页面..."></textarea>
      </div>
    </div>

    <footer class="status-bar">
      <span>
        已识别：<span class="lang-name" id="detected-name">—</span>
        <span class="lang-source" id="detected-source"></span>
      </span>
      <span class="right" id="cursor-pos">Ln 1, Col 1</span>
    </footer>
  </div>
  <div class="drop-overlay" id="drop-overlay">松开以加载文件</div>

  <script type="module">
    import hljs from "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/es/highlight.min.js";

    // Languages we want to consider during auto-detection.
    // (Python is detected as one bucket here; we then refine to py2/py3 ourselves.)
    const AUTO_LANGS = [
      "csharp", "go", "python", "javascript", "typescript", "java",
      "kotlin", "swift", "rust", "cpp", "c", "ruby", "php",
      "bash", "sql", "json", "yaml", "xml", "css", "markdown",
    ];

    const DISPLAY = {
      auto: "自动识别",
      csharp: "C#", go: "Go", python: "Python",
      python2: "Python 2", python3: "Python 3",
      javascript: "JavaScript", typescript: "TypeScript",
      java: "Java", kotlin: "Kotlin", swift: "Swift", rust: "Rust",
      cpp: "C++", c: "C", ruby: "Ruby", php: "PHP",
      bash: "Bash", sql: "SQL", json: "JSON", yaml: "YAML",
      xml: "HTML / XML", css: "CSS", markdown: "Markdown",
      plaintext: "Plain Text",
    };

    // hljs only ships one "python" grammar — map our py2/py3 ids to it.
    function hljsLang(id) {
      if (id === "python2" || id === "python3") return "python";
      return id;
    }

    /**
     * Score Python source for dialect-specific syntactic markers and pick the
     * winner. Python 3 wins ties (modern default). The grammar that hljs uses
     * cannot make this distinction — this lives outside of hljs on purpose.
     */
    function classifyPython(src) {
      const py2 = [
        /\bprint\s+(?!\()[^\n]/,        // print statement: `print x`
        /\bxrange\s*\(/,
        /\braw_input\s*\(/,
        /\bunicode\s*\(/,
        /\bbasestring\b/,
        /\bhas_key\s*\(/,
        /\b\.iteritems\s*\(/,
        /\b\.iterkeys\s*\(/,
        /\b\.itervalues\s*\(/,
        /\bexcept\s+\w+\s*,\s*\w+\s*:/,  // except E, e:
        /\braise\s+\w+\s*,\s*['"]/,      // raise E, "msg"
        /<>/,                            // legacy ne operator
        /from\s+__future__\s+import/,    // 2-code reaching for 3 features
      ];
      const py3 = [
        /\bprint\s*\(/,                  // print as function
        /\bf['"]/,                       // f-string
        /\basync\s+def\b/,
        /\bawait\s+\w/,
        /:\s*\w[\w\[\], .]*\s*=/,        // annotated assignment
        /->\s*\w[\w\[\], .]*\s*:/,       // return annotation
        /:=/,                            // walrus
        /\bnonlocal\b/,
        /\bmatch\s+\w[^\n]*:\s*\n\s+case\b/,
      ];
      let s2 = 0; for (const r of py2) if (r.test(src)) s2++;
      let s3 = 0; for (const r of py3) if (r.test(src)) s3++;
      return s2 > s3 ? "python2" : "python3";
    }

    function pickLanguage(src, override) {
      if (override && override !== "auto") {
        return { id: override, source: "manual" };
      }
      const trimmed = src.trim();
      if (!trimmed) return { id: "plaintext", source: "auto" };
      const res = hljs.highlightAuto(trimmed, AUTO_LANGS);
      let id = res.language || "plaintext";
      if (id === "python") id = classifyPython(src);
      return { id, source: "auto" };
    }

    /**
     * Wrap each line of highlighted HTML in <span class="ln"> so the CSS
     * counter can render the gutter. hljs spans can straddle newlines (think
     * multi-line strings); we track the open <span> stack across lines and
     * re-emit the prefix/suffix to keep each wrapped line self-balanced.
     */
    function wrapLines(html) {
      const lines = html.split("\n");
      const open = [];
      const out = [];
      const tagRe = /<(\/?)span(\s[^>]*)?>/g;
      for (const line of lines) {
        const prefix = open.join("");
        let m;
        tagRe.lastIndex = 0;
        while ((m = tagRe.exec(line)) !== null) {
          if (m[1] === "/") open.pop();
          else open.push(m[0]);
        }
        const suffix = "</span>".repeat(open.length);
        out.push(`<span class="ln">${prefix}${line}${suffix}</span>`);
      }
      return out.join("");
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // ------------------------------------------------------------------
    //  Function / class extractors
    //  Each returns an array of { kind, name, line, signature?, parent?,
    //  displayName }. Best-effort regex; not a real parser. Misses are
    //  acceptable for an outline tool — false positives are worse, so the
    //  patterns lean strict.
    // ------------------------------------------------------------------

    function countBraces(line) {
      // Naive: doesn't strip strings/comments. Good enough at the line scale
      // for brace-language scope tracking.
      let open = 0, close = 0;
      for (let i = 0; i < line.length; i++) {
        if (line[i] === "{") open++;
        else if (line[i] === "}") close++;
      }
      return open - close;
    }

    function extractPython(src) {
      const lines = src.split("\n");
      const items = [];
      const classStack = []; // [{ indent, name }]
      const reClass = /^(\s*)class\s+([A-Za-z_]\w*)/;
      const reDef = /^(\s*)(?:async\s+)?def\s+([A-Za-z_]\w*)\s*\(([^)]*)\)/;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (/^\s*$/.test(line) || /^\s*#/.test(line)) continue;
        const indent = (line.match(/^(\s*)/)[1] || "").length;
        while (classStack.length && indent <= classStack[classStack.length - 1].indent) {
          classStack.pop();
        }
        const c = reClass.exec(line);
        if (c) {
          classStack.push({ indent, name: c[2] });
          items.push({ kind: "class", name: c[2], displayName: c[2], line: i + 1 });
          continue;
        }
        const d = reDef.exec(line);
        if (d) {
          const parent = classStack.length ? classStack[classStack.length - 1].name : null;
          const displayName = parent ? `${parent}.${d[2]}` : d[2];
          items.push({
            kind: parent ? "method" : "function",
            name: d[2], parent, displayName,
            signature: `(${d[3].trim()})`, line: i + 1,
          });
        }
      }
      return items;
    }

    function extractGo(src) {
      const lines = src.split("\n");
      const items = [];
      const reRecv = /^func\s*\(\s*\w+\s+\*?(\w+)\s*\)\s*(\w+)\s*\(([^)]*)\)/;
      const reFn = /^func\s+(\w+)\s*\(([^)]*)\)/;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        let m = reRecv.exec(line);
        if (m) {
          items.push({
            kind: "method", name: m[2], parent: m[1],
            displayName: `${m[1]}.${m[2]}`,
            signature: `(${m[3].trim()})`, line: i + 1,
          });
          continue;
        }
        m = reFn.exec(line);
        if (m) {
          items.push({
            kind: "function", name: m[1], displayName: m[1],
            signature: `(${m[2].trim()})`, line: i + 1,
          });
        }
      }
      return items;
    }

    // Keywords that look like method calls but aren't method definitions.
    const STMT_KEYWORDS = new Set([
      "if", "for", "while", "switch", "catch", "using", "foreach",
      "return", "new", "typeof", "sizeof", "lock", "fixed", "checked",
      "unchecked", "do", "yield", "throw", "await",
    ]);

    function extractCSharpLike(src, opts = {}) {
      // Works for C# / Java / Kotlin (rough). opts.allowFun adds Kotlin-style.
      const lines = src.split("\n");
      const items = [];
      const classStack = []; // [{ name, depth }]
      let depth = 0;
      const reMethod = /^\s*(?:(?:public|private|protected|internal|static|virtual|override|async|sealed|abstract|extern|unsafe|readonly|new|partial|final|synchronized|native|default)\s+)*[\w<>?,. \[\]]+\s+(\w+)\s*\(([^)]*)\)\s*(?:\{|;|=>|throws\b|where\b|\s*$)/;
      const reClass = /^\s*(?:(?:public|private|protected|internal|static|abstract|sealed|partial|final)\s+)*(?:class|struct|interface|record|enum)\s+(\w+)/;
      const reKotlinFun = /^\s*(?:(?:public|private|protected|internal|open|override|abstract|final|suspend|inline|operator)\s+)*fun\s+(?:<[^>]+>\s+)?(?:[\w<>?,. ]+\.)?(\w+)\s*\(([^)]*)\)/;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const c = reClass.exec(line);
        if (c) {
          classStack.push({ name: c[1], depth: depth + 1 });
          items.push({ kind: "class", name: c[1], displayName: c[1], line: i + 1 });
          depth += countBraces(line);
          while (classStack.length && depth < classStack[classStack.length - 1].depth) classStack.pop();
          continue;
        }
        let matched = false;
        if (opts.allowFun) {
          const k = reKotlinFun.exec(line);
          if (k && !STMT_KEYWORDS.has(k[1])) {
            const parent = classStack.length ? classStack[classStack.length - 1].name : null;
            items.push({
              kind: parent ? "method" : "function",
              name: k[1], parent,
              displayName: parent ? `${parent}.${k[1]}` : k[1],
              signature: `(${k[2].trim()})`, line: i + 1,
            });
            matched = true;
          }
        }
        if (!matched) {
          const m = reMethod.exec(line);
          if (m && !STMT_KEYWORDS.has(m[1])) {
            const parent = classStack.length ? classStack[classStack.length - 1].name : null;
            items.push({
              kind: parent ? "method" : "function",
              name: m[1], parent,
              displayName: parent ? `${parent}.${m[1]}` : m[1],
              signature: `(${m[2].trim()})`, line: i + 1,
            });
          }
        }
        depth += countBraces(line);
        while (classStack.length && depth < classStack[classStack.length - 1].depth) classStack.pop();
      }
      return items;
    }

    function extractJS(src) {
      const lines = src.split("\n");
      const items = [];
      const classStack = [];
      let depth = 0;
      const reClass = /^\s*(?:export\s+(?:default\s+)?)?(?:abstract\s+)?class\s+(\w+)/;
      const reFn = /^\s*(?:export\s+(?:default\s+)?)?(?:async\s+)?function\s*\*?\s*(\w+)\s*\(([^)]*)\)/;
      const reArrow = /^\s*(?:export\s+(?:default\s+)?)?(?:const|let|var)\s+(\w+)\s*(?::\s*[^=]+)?=\s*(?:async\s+)?\(([^)]*)\)\s*(?::\s*[^=]+)?=>/;
      const reConstFn = /^\s*(?:export\s+(?:default\s+)?)?(?:const|let|var)\s+(\w+)\s*=\s*(?:async\s+)?function\s*\*?\s*\(([^)]*)\)/;
      const reMethod = /^\s+(?:static\s+|async\s+|get\s+|set\s+|\*\s*|public\s+|private\s+|protected\s+|readonly\s+|override\s+)*([\w$]+)\s*\(([^)]*)\)\s*(?:\{|:\s*[\w<>?,. \[\]]+\s*\{)/;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const c = reClass.exec(line);
        if (c) {
          classStack.push({ name: c[1], depth: depth + 1 });
          items.push({ kind: "class", name: c[1], displayName: c[1], line: i + 1 });
          depth += countBraces(line);
          while (classStack.length && depth < classStack[classStack.length - 1].depth) classStack.pop();
          continue;
        }
        const fn = reFn.exec(line);
        if (fn) {
          items.push({ kind: "function", name: fn[1], displayName: fn[1], signature: `(${fn[2].trim()})`, line: i + 1 });
          depth += countBraces(line);
          continue;
        }
        const cf = reConstFn.exec(line);
        if (cf) {
          items.push({ kind: "function", name: cf[1], displayName: cf[1], signature: `(${cf[2].trim()})`, line: i + 1 });
          depth += countBraces(line);
          continue;
        }
        const ar = reArrow.exec(line);
        if (ar) {
          items.push({ kind: "function", name: ar[1], displayName: ar[1], signature: `(${ar[2].trim()})`, line: i + 1 });
          depth += countBraces(line);
          continue;
        }
        if (classStack.length) {
          const m = reMethod.exec(line);
          if (m && !STMT_KEYWORDS.has(m[1])) {
            const parent = classStack[classStack.length - 1].name;
            items.push({
              kind: "method", name: m[1], parent,
              displayName: `${parent}.${m[1]}`,
              signature: `(${m[2].trim()})`, line: i + 1,
            });
          }
        }
        depth += countBraces(line);
        while (classStack.length && depth < classStack[classStack.length - 1].depth) classStack.pop();
      }
      return items;
    }

    function extractRust(src) {
      const lines = src.split("\n");
      const items = [];
      const reFn = /^\s*(?:pub(?:\([^)]*\))?\s+)?(?:async\s+|const\s+|unsafe\s+|extern\s+(?:"[^"]*"\s+)?)*fn\s+(\w+)\s*(?:<[^>]*>)?\s*\(([^)]*)\)/;
      const reImpl = /^\s*impl(?:<[^>]*>)?\s+(?:[\w<>:,'\s+&]+?\s+for\s+)?([\w<>]+)/;
      const reStruct = /^\s*(?:pub(?:\([^)]*\))?\s+)?(?:struct|enum|trait)\s+(\w+)/;
      const implStack = [];
      let depth = 0;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const s = reStruct.exec(line);
        if (s) {
          items.push({ kind: "class", name: s[1], displayName: s[1], line: i + 1 });
          depth += countBraces(line);
          continue;
        }
        const im = reImpl.exec(line);
        if (im) {
          implStack.push({ name: im[1], depth: depth + 1 });
          items.push({ kind: "impl", name: im[1], displayName: `impl ${im[1]}`, line: i + 1 });
          depth += countBraces(line);
          continue;
        }
        const fn = reFn.exec(line);
        if (fn) {
          const parent = implStack.length ? implStack[implStack.length - 1].name : null;
          items.push({
            kind: parent ? "method" : "function",
            name: fn[1], parent,
            displayName: parent ? `${parent}.${fn[1]}` : fn[1],
            signature: `(${fn[2].trim()})`, line: i + 1,
          });
        }
        depth += countBraces(line);
        while (implStack.length && depth < implStack[implStack.length - 1].depth) implStack.pop();
      }
      return items;
    }

    function extractCFamily(src) {
      // C / C++ are hard without a real parser. Catch the common case of a
      // function definition that opens its body on the same line.
      const lines = src.split("\n");
      const items = [];
      // [optional return type incl. pointers] name(...) { ...
      const re = /^[ \t]*(?:[A-Za-z_][\w:]*\s*[*&]?\s+)+([A-Za-z_]\w*)\s*\(([^)]*)\)\s*(?:const\s*)?(?:noexcept\s*)?(?:override\s*)?\{?\s*$/;
      for (let i = 0; i < lines.length; i++) {
        const m = re.exec(lines[i]);
        if (!m) continue;
        if (STMT_KEYWORDS.has(m[1])) continue;
        items.push({ kind: "function", name: m[1], displayName: m[1], signature: `(${m[2].trim()})`, line: i + 1 });
      }
      return items;
    }

    function extractFunctions(src, langId) {
      switch (langId) {
        case "python2":
        case "python3":
        case "python":   return extractPython(src);
        case "go":       return extractGo(src);
        case "csharp":   return extractCSharpLike(src);
        case "java":     return extractCSharpLike(src);
        case "kotlin":   return extractCSharpLike(src, { allowFun: true });
        case "javascript":
        case "typescript": return extractJS(src);
        case "rust":     return extractRust(src);
        case "c":
        case "cpp":      return extractCFamily(src);
        default:         return [];
      }
    }

    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const hlLayer = document.querySelector(".hl-layer");
    const editorWrap = document.getElementById("editor-wrap");
    const langSelect = document.getElementById("lang-select");
    const detectedName = document.getElementById("detected-name");
    const detectedSource = document.getElementById("detected-source");
    const cursorPos = document.getElementById("cursor-pos");
    const fileInput = document.getElementById("file-input");
    const openBtn = document.getElementById("open-btn");
    const clearBtn = document.getElementById("clear-btn");
    const dropOverlay = document.getElementById("drop-overlay");
    const outline = document.getElementById("outline");
    const outlineList = document.getElementById("outline-list");
    const outlineToggle = document.getElementById("outline-toggle");

    // Latest extracted functions for the current source. The hash router
    // and click handler both consume this.
    let currentFunctions = [];

    /**
     * Re-size the absolutely-positioned textarea to match the highlight
     * layer's natural height. Without this, the textarea is capped at the
     * viewport and the user can't type past the bottom edge.
     */
    function syncSize() {
      const h = hlLayer.scrollHeight;
      const w = hlLayer.scrollWidth;
      input.style.height = h + "px";
      input.style.width = Math.max(w, editorWrap.clientWidth) + "px";
    }

    function render() {
      const src = input.value;
      const { id, source } = pickLanguage(src, langSelect.value);

      let highlighted;
      try {
        const lang = hljsLang(id);
        highlighted = hljs.getLanguage(lang)
          ? hljs.highlight(src, { language: lang, ignoreIllegals: true }).value
          : escapeHtml(src);
      } catch {
        highlighted = escapeHtml(src);
      }

      output.className = `hljs language-${hljsLang(id)}`;
      output.innerHTML = wrapLines(highlighted);

      detectedName.textContent = DISPLAY[id] || id;
      detectedSource.textContent = source === "manual" ? "· 手动" : "· 自动";

      currentFunctions = extractFunctions(src, id);
      renderOutline();

      syncSize();
    }

    /**
     * Build the outline sidebar from `currentFunctions`. Empty state shows a
     * placeholder. Selecting the active item is left to jump events.
     */
    function renderOutline() {
      outlineList.innerHTML = "";
      if (!currentFunctions.length) {
        const empty = document.createElement("div");
        empty.className = "outline-empty";
        empty.textContent = "暂无函数 / 类";
        outlineList.appendChild(empty);
        return;
      }
      for (const item of currentFunctions) {
        const li = document.createElement("li");
        li.className = `kind-${item.kind}`;
        li.dataset.line = item.line;
        li.dataset.displayName = item.displayName;
        const nameEl = document.createElement("span");
        nameEl.className = "name";
        nameEl.textContent = item.displayName;
        if (item.signature) nameEl.title = `${item.displayName}${item.signature}`;
        const lineEl = document.createElement("span");
        lineEl.className = "line-no";
        lineEl.textContent = String(item.line);
        li.appendChild(nameEl);
        li.appendChild(lineEl);
        li.addEventListener("click", () => {
          jumpToLine(item.line);
          setActiveOutlineItem(li);
          // Push the function into the URL so the location is shareable.
          // Use replaceState (not assignment) to avoid an extra hashchange
          // that would fight with the click handler.
          history.replaceState(null, "", `#fn=${encodeURIComponent(item.displayName)}`);
        });
        outlineList.appendChild(li);
      }
    }

    function setActiveOutlineItem(li) {
      outlineList.querySelectorAll("li.active").forEach((el) => el.classList.remove("active"));
      if (li) li.classList.add("active");
    }

    /**
     * Scroll the editor so `lineNum` (1-based) is centered, move the caret
     * to the start of that line, and flash a brief highlight.
     */
    function jumpToLine(lineNum) {
      const lns = hlLayer.querySelectorAll(".ln");
      const target = lns[lineNum - 1];
      if (!target) return;

      // Move the caret to the start of the target line. Compute the char
      // offset by counting the lengths of the preceding lines.
      const allLines = input.value.split("\n");
      let offset = 0;
      for (let i = 0; i < lineNum - 1 && i < allLines.length; i++) {
        offset += allLines[i].length + 1;  // +1 for the joining \n
      }
      input.focus({ preventScroll: true });
      input.setSelectionRange(offset, offset);

      // Center the target line in the viewport. We can't trust the textarea
      // to do this (overflow: hidden), so we drive .editor-wrap directly.
      const wrapRect = editorWrap.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const delta = (targetRect.top - wrapRect.top) - (wrapRect.height / 2) + (target.offsetHeight / 2);
      editorWrap.scrollTo({ top: editorWrap.scrollTop + delta, behavior: "smooth" });

      // Restart the flash animation by toggling the class.
      target.classList.remove("target-flash");
      // Force reflow so removing + re-adding the class re-fires the animation.
      void target.offsetWidth;
      target.classList.add("target-flash");
    }

    function jumpFromHash() {
      const h = location.hash.replace(/^#/, "");
      if (!h) return;
      const params = new URLSearchParams(h);
      const fn = params.get("fn");
      if (!fn) return;
      const match = currentFunctions.find(
        (it) => it.displayName === fn || it.name === fn,
      );
      if (!match) return;
      jumpToLine(match.line);
      const li = outlineList.querySelector(`li[data-display-name="${CSS.escape(fn)}"]`);
      setActiveOutlineItem(li);
    }

    function updateCursorPos() {
      const pos = input.selectionStart;
      const before = input.value.slice(0, pos);
      const line = before.split("\n").length;
      const lastNl = before.lastIndexOf("\n");
      const col = pos - (lastNl + 1) + 1;
      cursorPos.textContent = `Ln ${line}, Col ${col}`;
    }

    input.addEventListener("input", () => {
      render();
      updateCursorPos();
    });
    input.addEventListener("keyup", updateCursorPos);
    input.addEventListener("click", updateCursorPos);
    input.addEventListener("select", updateCursorPos);

    // Tab inserts spaces instead of moving focus away from the editor.
    input.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = input.selectionStart;
        const end = input.selectionEnd;
        const indent = "    ";
        input.setRangeText(indent, start, end, "end");
        render();
        updateCursorPos();
      }
    });

    langSelect.addEventListener("change", render);

    openBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", async () => {
      const f = fileInput.files?.[0];
      if (!f) return;
      input.value = await f.text();
      fileInput.value = "";
      langSelect.value = "auto";
      render();
      updateCursorPos();
    });

    clearBtn.addEventListener("click", () => {
      input.value = "";
      render();
      updateCursorPos();
    });

    let dragDepth = 0;
    window.addEventListener("dragenter", (e) => {
      if (!e.dataTransfer?.types?.includes("Files")) return;
      e.preventDefault();
      dragDepth++;
      dropOverlay.classList.add("active");
    });
    window.addEventListener("dragover", (e) => {
      if (e.dataTransfer?.types?.includes("Files")) e.preventDefault();
    });
    window.addEventListener("dragleave", (e) => {
      if (!e.dataTransfer?.types?.includes("Files")) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) dropOverlay.classList.remove("active");
    });
    window.addEventListener("drop", async (e) => {
      if (!e.dataTransfer?.files?.length) return;
      e.preventDefault();
      dragDepth = 0;
      dropOverlay.classList.remove("active");
      const f = e.dataTransfer.files[0];
      input.value = await f.text();
      langSelect.value = "auto";
      render();
      updateCursorPos();
    });

    window.addEventListener("resize", syncSize);

    outlineToggle.addEventListener("click", () => {
      const collapsed = outline.classList.toggle("collapsed");
      outlineToggle.textContent = collapsed ? "»" : "«";
      // Width change reflows the editor; resync the textarea width.
      setTimeout(syncSize, 200);
    });

    window.addEventListener("hashchange", jumpFromHash);

    input.value = `# Python 3 example — f-strings + type hints + async
async def greet(name: str) -> str:
    msg = f"Hello, {name}!"
    print(msg)
    return msg

class Greeter:
    def __init__(self, prefix: str = "Hi"):
        self.prefix = prefix

    async def say(self, name: str) -> None:
        await greet(f"{self.prefix}, {name}")
`;
    render();
    updateCursorPos();
    // If the page was opened with #fn=..., honor it once the initial outline
    // has been populated.
    if (location.hash) jumpFromHash();
  </script>
</body>
</html>
