<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown 渲染 · Gadgets</title>
  <link rel="stylesheet" href="../assets/common.css" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/tokyo-night-dark.min.css"
  />
  <style>
    .split {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }
    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .pane + .pane { border-left: 1px solid var(--border); }
    .pane-header {
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text-dim);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #input {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      outline: none;
      padding: 16px;
      background: var(--panel-2);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      tab-size: 2;
    }
    #preview {
      flex: 1;
      overflow: auto;
      padding: 24px 32px;
      background: var(--bg);
    }

    /* ---------- Markdown preview typography ---------- */
    #preview h1, #preview h2, #preview h3,
    #preview h4, #preview h5, #preview h6 {
      margin-top: 1.4em;
      margin-bottom: 0.6em;
      line-height: 1.3;
      font-weight: 600;
    }
    #preview h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    #preview h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.25em; }
    #preview h3 { font-size: 1.25em; }
    #preview p, #preview ul, #preview ol, #preview blockquote {
      margin: 0.6em 0;
    }
    #preview ul, #preview ol { padding-left: 1.6em; }
    #preview blockquote {
      border-left: 3px solid var(--accent);
      color: var(--text-dim);
      padding: 0.2em 1em;
      margin-left: 0;
    }
    #preview a { color: var(--accent); }
    #preview code {
      background: var(--code-bg);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.92em;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
    }
    #preview pre {
      background: var(--code-bg);
      padding: 14px 16px;
      border-radius: 8px;
      overflow: auto;
      border: 1px solid var(--border);
    }
    #preview pre code {
      background: transparent;
      padding: 0;
      font-size: 13px;
      line-height: 1.55;
    }
    #preview table {
      border-collapse: collapse;
      margin: 0.8em 0;
    }
    #preview th, #preview td {
      border: 1px solid var(--border);
      padding: 6px 12px;
    }
    #preview th { background: var(--panel); }
    #preview hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.6em 0;
    }
    #preview img { max-width: 100%; }

    /* Mermaid container */
    #preview .mermaid {
      background: var(--panel);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      text-align: center;
      overflow: auto;
    }
    #preview .mermaid-error {
      background: rgba(247, 118, 142, 0.08);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }

    @media (max-width: 720px) {
      .split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .pane + .pane { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Markdown 渲染</h1>
      <div class="actions">
        <input type="file" id="file-input" accept=".md,.markdown,text/markdown,text/plain" hidden />
        <button id="open-btn">打开文件</button>
        <button id="clear-btn">清空</button>
        <a class="home-link" href="../">← Gadgets</a>
      </div>
    </header>
    <div class="split">
      <div class="pane">
        <div class="pane-header">输入（Markdown）</div>
        <textarea id="input" spellcheck="false" placeholder="在此粘贴 Markdown，或将 .md 文件拖入页面..."></textarea>
      </div>
      <div class="pane">
        <div class="pane-header">预览</div>
        <div id="preview"></div>
      </div>
    </div>
  </div>
  <div class="drop-overlay" id="drop-overlay">松开以加载 Markdown 文件</div>

  <script type="module">
    import { marked } from "https://cdn.jsdelivr.net/npm/marked@12.0.2/+esm";
    import hljs from "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/es/highlight.min.js";
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.esm.min.mjs";

    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      securityLevel: "loose",
      fontFamily: 'ui-monospace, "SF Mono", Consolas, monospace',
    });

    // marked: route ```mermaid blocks through a placeholder so we can render them after innerHTML insertion.
    // Renderer signature differs by marked version (positional vs token object), so unpack both.
    marked.use({
      renderer: {
        code(codeArg, infoArg) {
          let text, lang;
          if (typeof codeArg === "string") {
            text = codeArg;
            lang = infoArg || "";
          } else {
            text = codeArg.text || "";
            lang = codeArg.lang || "";
          }
          lang = lang.trim().toLowerCase();

          if (lang === "mermaid") {
            return `<div class="mermaid">${escapeHtml(text)}</div>`;
          }
          let highlighted;
          try {
            highlighted = lang && hljs.getLanguage(lang)
              ? hljs.highlight(text, { language: lang }).value
              : hljs.highlightAuto(text).value;
          } catch {
            highlighted = escapeHtml(text);
          }
          return `<pre><code class="hljs language-${lang}">${highlighted}</code></pre>`;
        },
      },
      gfm: true,
      breaks: false,
    });

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    const input = document.getElementById("input");
    const preview = document.getElementById("preview");
    const fileInput = document.getElementById("file-input");
    const openBtn = document.getElementById("open-btn");
    const clearBtn = document.getElementById("clear-btn");
    const dropOverlay = document.getElementById("drop-overlay");

    let renderToken = 0;
    async function render() {
      const myToken = ++renderToken;
      const src = input.value;
      const html = marked.parse(src);
      if (myToken !== renderToken) return;
      preview.innerHTML = html;

      const blocks = preview.querySelectorAll("div.mermaid");
      for (let i = 0; i < blocks.length; i++) {
        const el = blocks[i];
        const code = el.textContent;
        const id = `mermaid-${Date.now()}-${i}`;
        try {
          const { svg, bindFunctions } = await mermaid.render(id, code);
          if (myToken !== renderToken) return;
          el.innerHTML = svg;
          if (bindFunctions) bindFunctions(el);
        } catch (err) {
          el.classList.remove("mermaid");
          el.classList.add("mermaid-error");
          el.textContent = `Mermaid render error:\n${err?.message || err}`;
        }
      }
    }

    let renderTimer = null;
    input.addEventListener("input", () => {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 120);
    });

    openBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", async () => {
      const f = fileInput.files?.[0];
      if (!f) return;
      input.value = await f.text();
      fileInput.value = "";
      render();
    });

    clearBtn.addEventListener("click", () => {
      input.value = "";
      preview.innerHTML = "";
    });

    // Drag & drop file anywhere on the page.
    let dragDepth = 0;
    window.addEventListener("dragenter", (e) => {
      if (!e.dataTransfer?.types?.includes("Files")) return;
      e.preventDefault();
      dragDepth++;
      dropOverlay.classList.add("active");
    });
    window.addEventListener("dragover", (e) => {
      if (e.dataTransfer?.types?.includes("Files")) e.preventDefault();
    });
    window.addEventListener("dragleave", (e) => {
      if (!e.dataTransfer?.types?.includes("Files")) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) dropOverlay.classList.remove("active");
    });
    window.addEventListener("drop", async (e) => {
      if (!e.dataTransfer?.files?.length) return;
      e.preventDefault();
      dragDepth = 0;
      dropOverlay.classList.remove("active");
      const f = e.dataTransfer.files[0];
      input.value = await f.text();
      render();
    });

    // Initial demo content so the tool isn't empty on first load.
    input.value = `# Markdown 渲染 Demo

支持 **GFM**、代码高亮、以及 Mermaid 图表。

## 代码高亮

\`\`\`js
function greet(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

## Mermaid 流程图

\`\`\`mermaid
flowchart LR
  A[输入 Markdown] --> B{包含 Mermaid?}
  B -- 是 --> C[渲染图表]
  B -- 否 --> D[普通预览]
  C --> E[显示]
  D --> E
\`\`\`

## 表格

| 工具 | 状态 |
|------|------|
| Markdown | ✅ |
| JSON | ⏳ |
`;
    render();
  </script>
</body>
</html>
